name: Deploy FATCAT-3D

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fatcat3d-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy on Oracle VPS
    runs-on: [self-hosted, fatcat3d]

    timeout-minutes: 20

    env:
      APP_NAME: fatcat3d-web
      PUBLIC_URL: https://fatcat3d.mkredsis.duckdns.org
      REMOTE_BASE: /opt/stacks/fatcat3d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build -t "$APP_NAME:$GITHUB_SHA" .

      - name: Restart production container
        run: |
          set -euo pipefail

          BACKUP_DIR="/home/ubuntu/backups/$APP_NAME"
          mkdir -p "$REMOTE_BASE" "$BACKUP_DIR"

          if docker inspect "$APP_NAME" >/dev/null 2>&1; then
            docker inspect "$APP_NAME" > "$BACKUP_DIR/container-before-$GITHUB_SHA.inspect.json"
          fi

          docker rm -f "$APP_NAME" >/dev/null 2>&1 || true
          docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --network ubuntu_vps-network \
            -p 127.0.0.1:3107:80 \
            "$APP_NAME:$GITHUB_SHA"

          sleep 3
          docker ps --filter "name=$APP_NAME" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

      - name: Verify local app health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3107/ >/dev/null; then
              echo "FATCAT-3D responde OK"; exit 0
            fi
            sleep 5
          done
          echo "::error::FATCAT-3D no responde tras el despliegue"; exit 1

      - name: Verify public route through Nginx Proxy Manager
        run: |
          set -euo pipefail
          curl -fsSI "$PUBLIC_URL/" | grep -E '^HTTP/|^server:|^content-type:' -i