name: Build & Deploy FATCAT-3D

# ================================================================
# Workflow AISLADO: solo construye y despliega el contenedor
# "fatcat3d-web". No toca ningún otro contenedor, imagen o stack
# que ya viva en el VPS.
#
# Requisitos en el repo (Settings > Variables > Actions):
#   DEPLOY_DIR  -> ruta en el VPS donde vive este proyecto
#                  ej. /opt/stacks/fatcat3d   (debe ser una carpeta
#                  NUEVA y exclusiva, no compartida con otros stacks)
# ================================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      IMAGE: fatcat3d-web
      CONTAINER: fatcat3d-web
      PORT: "3107"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar variable DEPLOY_DIR
        run: |
          if [ -z "${{ vars.DEPLOY_DIR }}" ]; then
            echo "::error::Falta la variable de repo DEPLOY_DIR. Configúrala en Settings > Variables > Actions."
            exit 1
          fi

      - name: Construir imagen Docker (solo fatcat3d-web)
        run: docker build -t "$IMAGE:latest" .

      - name: Publicar compose file en DEPLOY_DIR
        run: |
          mkdir -p "${{ vars.DEPLOY_DIR }}"
          cp docker-compose.yml "${{ vars.DEPLOY_DIR }}/docker-compose.yml"

      - name: Asegurar red externa ubuntu_vps-network (crear solo si no existe)
        run: |
          if ! docker network inspect ubuntu_vps-network >/dev/null 2>&1; then
            echo "La red ubuntu_vps-network no existe; creándola (no afecta contenedores existentes)..."
            docker network create ubuntu_vps-network
          else
            echo "Red ubuntu_vps-network ya existe, se reutiliza."
          fi

      - name: Redesplegar SOLO fatcat3d-web (sin --force-recreate de otros servicios)
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          docker compose up -d --no-deps --build fatcat3d-web

      - name: Healthcheck del contenedor
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              echo "fatcat3d-web responde en el puerto ${PORT}"
              exit 0
            fi
            echo "Esperando a que el sitio responda... intento $i"
            sleep 5
          done
          echo "::error::El contenedor no respondió en http://127.0.0.1:${PORT}"
          docker logs --tail 50 "$CONTAINER" || true
          exit 1

      - name: Limpieza segura (solo imágenes <none> de este build)
        if: always()
        run: docker image prune -f
